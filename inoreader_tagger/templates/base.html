<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inoreader Tagger{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1c1f24;
    --muted: #6b7280;
    --accent: #2f6feb;
    --ok-bg: #e7f6ec; --ok-fg: #14663a;
    --warn-bg: #fdf3d8; --warn-fg: #7a5a05;
    --bad-bg: #fdeaea; --bad-fg: #93231f;
    --neutral-bg: #eceef1; --neutral-fg: #4b5563;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --border: #2c313a;
      --text: #e7e9ec;
      --muted: #99a1ad;
      --accent: #6f9dff;
      --ok-bg: #12301f; --ok-fg: #79dda4;
      --warn-bg: #34290c; --warn-fg: #e9c46a;
      --bad-bg: #3a1a1a; --bad-fg: #f3908b;
      --neutral-bg: #262a31; --neutral-fg: #aab2be;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 1rem 4rem;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 60rem; margin: 0 auto; }
  header.site {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: 1.75rem 0 1.25rem;
  }
  header.site h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  header.site h1 a { color: inherit; text-decoration: none; }
  header.site .sub { color: var(--muted); font-size: 0.85rem; }
  header.site .spacer { margin-left: auto; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: 1rem;
  }
  .panel h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .panel h3 { margin: 1.25rem 0 0.5rem; font-size: 0.9rem; color: var(--muted);
              text-transform: uppercase; letter-spacing: 0.06em; }
  a { color: var(--accent); }
  .pill {
    display: inline-block; padding: 0.12rem 0.55rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; white-space: nowrap;
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .pill.neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem;
       text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  .muted { color: var(--muted); }
  .small { font-size: 0.82rem; }
  button, .btn {
    font: inherit; font-size: 0.85rem; padding: 0.35rem 0.8rem; cursor: pointer;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); text-decoration: none;
    display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: 0.9; color: #fff; }
  button.danger:hover { border-color: var(--bad-fg); color: var(--bad-fg); }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  form.inline { display: inline; }
  .flash { border-radius: 8px; padding: 0.7rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.success { background: var(--ok-bg); color: var(--ok-fg); }
  .flash.error { background: var(--bad-bg); color: var(--bad-fg); }
  .banner {
    border-left: 3px solid var(--bad-fg); background: var(--bad-bg); color: var(--bad-fg);
    padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;
  }
  .banner a { color: inherit; font-weight: 600; }
  .grid { display: grid; gap: 0.5rem 1.25rem; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
  .field label { display: block; font-size: 0.75rem; color: var(--muted);
                 text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .field input[type=text], .field input[type=number] {
    width: 100%; font: inherit; padding: 0.4rem 0.55rem; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .field.check { display: flex; align-items: center; gap: 0.45rem; padding-top: 1.1rem; }
  .field.check label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 0.85rem; color: var(--text); }
  textarea {
    width: 100%; min-height: 22rem; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 0.7rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); resize: vertical;
  }
  pre.log {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.9rem; overflow-x: auto; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  footer.site { color: var(--muted); font-size: 0.78rem; padding: 1.5rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="/">Inoreader Tagger</a></h1>
    <span class="sub">{% block subtitle %}{% endblock %}</span>
    <span class="spacer"></span>
    <a class="btn" href="/auth/login">Connect an Inoreader account</a>
  </header>

  {% if flash %}<div class="flash {{ flash.tone }}">{{ flash.message }}</div>{% endif %}

  {% block content %}{% endblock %}

  <footer class="site">
    No login is configured — anyone who can reach this page can view and manage
    every connected account. Keep it on a trusted network.
  </footer>
</div>
</body>
</html>
